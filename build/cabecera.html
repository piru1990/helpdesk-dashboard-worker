<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Supervisión Mesa de Ayuda</title>
<style>
  /* Página de trabajo: una columna ancha, texto de sistema, tres series fijas por técnico. */
  :root {
    --color-bg: #f9f9f7; --color-panel: #ffffff; --color-fg: #14140f; --color-fg-muted: #5c5b55;
    --color-border-line: #e1e0d9; --color-ok: #0a8a0a; --color-warn: #b97800; --color-bad: #d03b3b;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --cds-text-secondary: #52514e; --cds-chart-grid: #e8e7e1; --cds-chart-axis: #c3c2b7; --cds-chart-reference: #6b6a64;
    --cds-surface-popover: #ffffff; --cds-border: #d6d5cd; --cds-shadow-popover: 0 6px 20px rgba(20, 20, 15, .14);
    --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-anthropic-serif: Georgia, "Times New Roman", serif;
    --cds-font-size-caption: 0.8125rem; --cds-font-size-body: 0.9375rem; --cds-font-size-heading: 1.125rem; --cds-font-size-title: 1.5rem;
    --cds-font-weight-medium: 600;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 24px; --cds-gap-xl: 32px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-pad-xl: 24px;
    --cds-radius: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #0f0f0e; --color-panel: #1a1a19; --color-fg: #f0efec; --color-fg-muted: #a9a8a0;
      --color-border-line: #2e2e2b; --color-ok: #2fbf2f; --color-warn: #fab219; --color-bad: #e66767;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --cds-text-secondary: #c3c2b7; --cds-chart-grid: #2c2c2a; --cds-chart-axis: #4a4a46; --cds-chart-reference: #a9a8a0;
      --cds-surface-popover: #232321; --cds-border: #3a3a37; --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.4; }
  #dash-root { max-width: 1180px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .pg-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
  .pg-head h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; text-wrap: balance; }
  .pg-head p { margin: 0; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .pg-head p.sm-error { color: var(--color-bad); }
  .dash-select { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background-color: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 5px 8px; max-width: 100%; }
  .dash-select:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  a { color: inherit; }
</style>
<link rel="icon" href="data:,">
</head>
<body>
<div id="dash-root">
<header class="pg-head">
  <h1>Supervisión Mesa de Ayuda</h1>
  <p id="estado" role="status">Consultando Odoo…</p>
</header>
